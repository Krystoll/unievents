services:
  postgres:
    image: postgres:16-alpine
    container_name: unievents-postgres
    environment:
      POSTGRES_DB: unievents
      POSTGRES_USER: unievents
      POSTGRES_PASSWORD: unievents
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unievents -d unievents"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
