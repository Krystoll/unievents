# Сервер
server.port=8080
server.servlet.context-path=/api

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/unievents
spring.datasource.username=unievents
spring.datasource.password=unievents
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT (минимум 32 символа для HS256)
jwt.secret=unievents-dev-secret-key-change-in-production
jwt.expiration=86400000

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
